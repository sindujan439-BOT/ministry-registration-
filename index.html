button:disabled{opacity:.6;cursor:not-allowed}
.hidden{display:none!important}

.toast.success{background:#16834b}.toast.error{background:#b93838}.toast.info{background:#245b91}

  #formPanel .q-icon svg{width:clamp(25px,2vw,32px);height:clamp(25px,2vw,32px);}
  #formPanel .question-block{grid-template-columns:clamp(52px,4.2vw,68px) minmax(0,1fr);column-gap:clamp(14px,1.4vw,22px);}
  #formPanel .choices{gap:clamp(10px,1vw,16px);}
  #formPanel .choice{min-height:clamp(68px,6vh,96px);font-size:clamp(18px,1.25vw,24px);padding:12px 16px;border-radius:16px;}
  #formPanel .professional-choices .choice{min-height:clamp(72px,6.2vh,100px);font-size:clamp(17px,1.15vw,22px);}
  #formPanel .professional-choices .choice svg{width:28px;height:28px;flex-basis:28px;}
  #formPanel .search{height:clamp(62px,5.2vh,82px);font-size:clamp(18px,1.2vw,23px);padding-left:54px;}
  #formPanel .searchicon{left:19px;top:18px;font-size:26px;}
  #formPanel .district-list{max-height:clamp(150px,17vh,280px);}
  #formPanel .district{padding:clamp(12px,1.1vh,18px) 18px;font-size:clamp(17px,1.1vw,21px);}
  #formPanel .selected{font-size:clamp(14px,.95vw,18px);}
  #formPanel .submit-row{margin-top:clamp(18px,2vh,34px);}
  #formPanel #nextBtn.primary{min-height:clamp(70px,6.5vh,102px);font-size:clamp(19px,1.35vw,25px);border-radius:16px;}
  .footer{max-width:1120px;}
}
@media (orientation:portrait) and (min-width:700px) and (min-height:1000px) and (max-height:1400px){
  #formPanel .panel-exhibition img{max-height:9vh;}
  #formPanel .form-grid{gap:1.2vh;}
  #formPanel .district-list{max-height:13vh;}
  #formPanel .submit-row{margin-top:1.2vh;}
}

</style>

<!-- Hidden form + iframe: submits to Apps Script without requiring browser CORS access. -->
<iframe name="submissionFrame" id="submissionFrame" class="hidden" title="Registration submission"></iframe>
<form id="transportForm" class="hidden" method="post" target="submissionFrame">
  <input type="hidden" name="payload" id="payloadField">
  <input type="hidden" name="clientToken" id="clientTokenField">
</form>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyH-9I0OyJqyVGdrdOVGBVzhgyQ28M4bWzILAOzfr_5j9mZtmtk9ufzJ3t-WkGnqNZW/exec";
const districts = ["Ampara","Anuradhapura","Badulla","Batticaloa","Colombo","Galle","Gampaha","Hambantota","Jaffna","Kalutara","Kandy","Kegalle","Kilinochchi","Kurunegala","Mannar","Matale","Matara","Monaragala","Mullaitivu","Nuwara Eliya","Polonnaruwa","Puttalam","Ratnapura","Trincomalee","Vavuniya"];
const state = {gender:"",professional:"",district:"",pendingToken:"",pendingSequenceKey:"",pendingSequenceNumber:0,timeout:null,submitStartedAt:0};
const $ = id => document.getElementById(id);
let toastTimer;

function showToast(message,type="info"){
  clearTimeout(toastTimer);
  const box=$("toast");box.textContent=message;box.className="toast "+type;
  toastTimer=setTimeout(()=>box.classList.add("hidden"),1000);
}
function resetForm(){
  state.gender="";state.professional="";state.district="";
  document.querySelectorAll(".choice").forEach(b=>b.setAttribute("aria-pressed","false"));
  $("districtSearch").value="";$("selectedDistrict").textContent="";
  $("districtList").classList.remove("open");renderDistricts("");
  $("nextBtn").disabled=true;$("nextBtn").textContent="SUBMIT REGISTRATION";
}
function showWelcome(){
  $("formPanel").classList.remove("hidden");
  resetForm();
}
function choose(group,value,key){
  state[key]=value;
  $(group).querySelectorAll(".choice").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.value===value)));
  updateSubmit();
}
function updateSubmit(){
  $("nextBtn").disabled=!(state.gender&&state.professional&&state.district)||!!state.pendingToken;
}
document.querySelectorAll("#genderChoices .choice").forEach(b=>b.addEventListener("click",()=>choose("genderChoices",b.dataset.value,"gender")));
document.querySelectorAll("#professionalChoices .choice").forEach(b=>b.addEventListener("click",()=>choose("professionalChoices",b.dataset.value,"professional")));
// Keep the professional value synchronized even if a mobile browser handles the tap unusually.
$("professionalChoices").addEventListener("click",e=>{
  const button=e.target.closest(".choice[data-value]");
  if(!button)return;
  choose("professionalChoices",button.dataset.value,"professional");
});

function renderDistricts(query){
  const list=$("districtList");list.replaceChildren();
  const matches=districts.filter(d=>d.toLowerCase().includes(query.trim().toLowerCase()));
  if(!matches.length){const empty=document.createElement("div");empty.className="noresult";empty.textContent="No matching district found.";list.appendChild(empty);return;}
  matches.forEach(d=>{
    const b=document.createElement("button");b.type="button";b.className="district";b.textContent=d;
    b.setAttribute("aria-pressed",String(state.district===d));
    b.addEventListener("click",()=>{state.district=d;$("districtSearch").value=d;$("selectedDistrict").textContent="Selected: "+d;renderDistricts(d);$("districtList").classList.remove("open");updateSubmit();});
    list.appendChild(b);
  });
}
$("districtSearch").addEventListener("focus",()=>{$("districtList").classList.add("open");renderDistricts($("districtSearch").value);});
$("districtSearch").addEventListener("input",e=>{$("districtList").classList.add("open");state.district="";$("selectedDistrict").textContent="";renderDistricts(e.target.value);updateSubmit();});
document.addEventListener("click",e=>{if(!e.target.closest("#districtChoices"))$("districtList").classList.remove("open");});
$("nextBtn").addEventListener("click",submitRegistration);

// Each browser/device receives a persistent device code and its own sequence.
// RequestID is stored in the existing RequestID spreadsheet column.
function getDeviceCode(){
  const key="NSW2026_DEVICE_CODE";
  let code=localStorage.getItem(key);
  if(!code){
    const raw=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());
    code="D"+raw.replace(/[^a-zA-Z0-9]/g,"").slice(0,6).toUpperCase();
    localStorage.setItem(key,code);
  }
  return code;
}
function getNextDeviceSequence(){
  const key="NSW2026_DEVICE_SEQUENCE_"+getDeviceCode();
  const current=parseInt(localStorage.getItem(key)||"0",10)||0;
  return {key:key,number:current+1};
}
function makeDeviceRequestId(){
  const next=getNextDeviceSequence();
  return {
    id:getDeviceCode()+"-"+String(next.number).padStart(6,"0"),
    sequenceKey:next.key,
    sequenceNumber:next.number
  };
}

function syncSelectionsFromButtons(){
  // Read the visible selected state as a safeguard before validation/submission.
  const selectedGender=$("genderChoices").querySelector('.choice[aria-pressed="true"]');
  const selectedProfessional=$("professionalChoices").querySelector('.choice[aria-pressed="true"]');
  if(selectedGender) state.gender=selectedGender.dataset.value;
  if(selectedProfessional) state.professional=selectedProfessional.dataset.value;
}

function submitRegistration(){
  syncSelectionsFromButtons();
  if(!(state.gender&&state.professional&&state.district)){showToast("Please answer all three questions.","error");return;}
  if(!API_URL.startsWith("https://script.google.com/macros/s/")||API_URL.includes("PASTE_YOUR")){
    showToast("Registration system is not configured yet.","error");return;
  }
  if(state.pendingToken)return;
  const deviceRequest=makeDeviceRequestId();
  const token=deviceRequest.id;
  state.pendingToken=token;
  state.submitStartedAt=performance.now();
  state.pendingSequenceKey=deviceRequest.sequenceKey;
  state.pendingSequenceNumber=deviceRequest.sequenceNumber;
  $("nextBtn").disabled=true;$("nextBtn").textContent="SUBMITTING…";
  $("payloadField").value=JSON.stringify({gender:state.gender,professional:state.professional,district:state.district,requestId:token});
  $("clientTokenField").value=token;$("transportForm").action=API_URL;$("transportForm").submit();
  state.timeout=setTimeout(()=>{
    if(state.pendingToken===token){
      state.pendingToken="";
      $("nextBtn").textContent="SUBMIT REGISTRATION";updateSubmit();
      showToast("No confirmation received. Check the connection before retrying.","error");
    }
  },20000);
}
window.addEventListener("message",event=>{
  const data=event.data;
  if(!data||data.type!=="MST_REGISTRATION_RESULT"||data.clientToken!==state.pendingToken)return;
  clearTimeout(state.timeout);
  if(data.success){
    const roundTripMs = state.submitStartedAt ? Math.round(performance.now() - state.submitStartedAt) : null;
    console.info("Registration browser round-trip: " + roundTripMs + " ms");
    state.submitStartedAt=0;
    // Advance this device's counter only after the backend confirms saving.
    if(state.pendingSequenceKey && state.pendingSequenceNumber){
      localStorage.setItem(state.pendingSequenceKey,String(state.pendingSequenceNumber));
    }
    const confirmedRequestId=state.pendingToken;
    state.pendingToken="";
    showToast("Registration successful · "+confirmedRequestId,"success");
    // Return to the ready form shortly after confirmation; no change to the form layout.
    setTimeout(showWelcome,350);
  }else{
    const roundTripMs = state.submitStartedAt ? Math.round(performance.now() - state.submitStartedAt) : null;
    console.info("Registration browser round-trip (failed): " + roundTripMs + " ms");
    state.submitStartedAt=0;
    state.pendingToken="";
    $("nextBtn").textContent="SUBMIT REGISTRATION";updateSubmit();
    showToast(data.message||"Registration failed. Please try again.","error");
  }
});
renderDistricts("");
</script>
</body>
</html>
