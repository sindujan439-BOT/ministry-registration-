
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>National Science Week 2026 | Registration</title>

<style>
:root {
  --navy:#123b68;
  --blue:#1768b2;
  --ink:#182536;
  --muted:#697789;
  --line:#dce5ef;
  --green:#138323;
}

* { box-sizing:border-box; }

html,body {
  margin:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--ink);
  background:#f9fbfe;
}

body { min-height:100vh; }

.app {
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:10px 14px;
}

.brand {
  width:min(100%,760px);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:7px;
}

.seal {
  width:clamp(55px,8vh,80px);
  height:clamp(55px,8vh,80px);
  object-fit:contain;
}

.exhibition {
  width:min(100%,430px);
  height:auto;
  max-height:100px;
  object-fit:contain;
}

.ministry {
  width:min(100%,370px);
  height:auto;
  max-height:65px;
  object-fit:contain;
}

main {
  width:min(100%,760px);
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px 0;
}

.panel {
  width:100%;
  background:#fff;
  border:1px solid #e5ebf2;
  border-radius:19px;
  padding:22px;
  box-shadow:0 10px 32px rgba(20,54,91,.07);
}

.welcome {
  text-align:center;
  max-width:540px;
  margin:auto;
}

.kicker {
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--blue);
  font-weight:800;
}

h1 {
  font-size:28px;
  color:var(--navy);
  margin:10px 0;
}

.intro {
  font-size:14px;
  line-height:1.55;
  color:var(--muted);
  margin:0 auto 22px;
  max-width:390px;
}

.primary {
  width:100%;
  min-height:52px;
  border:0;
  border-radius:12px;
  background:var(--navy);
  color:#fff;
  padding:13px 16px;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
}

.form-head { margin-bottom:18px; }

.form-head h2 {
  font-size:22px;
  color:var(--navy);
  margin:5px 0;
}

.form-head p {
  font-size:13px;
  color:var(--muted);
  margin:0;
}

.form-grid {
  display:flex;
  flex-direction:column;
  gap:16px;
}

.question-block {
  display:grid;
  grid-template-columns:42px minmax(0,1fr);
  column-gap:12px;
  align-items:start;
  min-width:0;
}

.q-icon {
  grid-column:1;
  grid-row:1 / span 2;
  width:42px;
  height:42px;
  border-radius:11px;
  background:#e8f1fc;
  color:#2469b7;
  display:grid;
  place-items:center;
  font-size:21px;
}

.question-label {
  grid-column:2;
  grid-row:1;
  font-size:14px;
  font-weight:800;
  margin:0 0 8px;
}

.choices {
  grid-column:2;
  grid-row:2;
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  min-width:0;
}

.choice {
  position:relative;
  flex:1 1 0;
  min-width:0;
  min-height:44px;
  border:1px solid #dce5ef;
  border-radius:10px;
  padding:9px;
  font-size:14px;
  font-weight:750;
  cursor:pointer;
}

.male {
  background:#eaf3ff;
  color:#174f9f;
}

.female {
  background:#fff0f6;
  color:#c83f78;
}

.prof {
  background:#edf5fc;
  color:#174a79;
}

.prof:nth-child(2) { background:#e2effb; }
.prof:nth-child(3) { background:#d5e8f8; }

.choice[aria-pressed="true"] {
  border:2px solid var(--navy);
  box-shadow:0 0 0 3px rgba(23,104,178,.13);
  font-weight:850;
}

.choice[aria-pressed="true"]::after {
  content:"✓";
  position:absolute;
  top:-7px;
  right:-6px;
  width:19px;
  height:19px;
  border-radius:50%;
  background:var(--navy);
  color:white;
  display:grid;
  place-items:center;
  font-size:12px;
}

.district-area {
  grid-column:2;
  grid-row:2;
  min-width:0;
}

.search {
  width:100%;
  height:46px;
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px 12px;
  font-size:14px;
  outline:none;
}

.search:focus {
  border-color:var(--blue);
  box-shadow:0 0 0 3px rgba(23,104,178,.1);
}

.district-list {
  display:none;
  margin-top:6px;
  border:1px solid var(--line);
  border-radius:10px;
  max-height:150px;
  overflow-y:auto;
  background:white;
}

.district-list.open { display:block; }

.district {
  width:100%;
  text-align:left;
  border:0;
  border-bottom:1px solid #edf1f5;
  background:white;
  padding:10px 12px;
  cursor:pointer;
  font-size:14px;
}

.district[aria-pressed="true"] {
  background:#dcecff;
  color:var(--navy);
  font-weight:800;
}

.noresult {
  padding:12px;
  color:var(--muted);
  font-size:13px;
}

.selected {
  color:var(--green);
  font-size:12px;
  font-weight:700;
  margin:5px 0 0;
}

.submit-row { margin-top:19px; }

#nextBtn {
  background:var(--green);
  min-height:53px;
  border-radius:11px;
}

button:disabled {
  opacity:.55;
  cursor:not-allowed;
}

.hidden { display:none !important; }

.toast {
  position:fixed;
  z-index:100;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  width:min(calc(100% - 28px),430px);
  padding:13px 16px;
  border-radius:13px;
  color:white;
  font-size:14px;
  font-weight:700;
  text-align:center;
  box-shadow:0 8px 28px rgba(0,0,0,.18);
}

.toast.success { background:#16834b; }
.toast.error { background:#b93838; }
.toast.info { background:#245b91; }

.footer {
  width:min(100%,760px);
  display:flex;
  justify-content:center;
  padding:8px;
}

@media(max-width:620px) {
  .app { padding:8px 11px; }
  .brand { gap:5px; }
  .seal { width:60px;height:60px; }
  .exhibition {
    width:min(100%,370px);
    max-height:75px;
  }
  .ministry {
    width:min(100%,330px);
    max-height:54px;
  }
  main {
    align-items:flex-start;
    padding:10px 0;
  }
  .panel {
    padding:17px 14px;
    border-radius:17px;
  }
  .choice {
    min-height:44px;
    font-size:13px;
  }
}

@media(max-width:360px) {
  .question-block {
    grid-template-columns:36px minmax(0,1fr);
    column-gap:9px;
  }
  .q-icon {
    width:36px;
    height:36px;
  }
  .choice { padding:8px 5px; }
}
</style>
</head>

<body>

<div id="toast" class="toast hidden"></div>

<div class="app">

<header class="brand">

  <img class="seal"
       src="sri-lanka-emblem.png"
       alt="Sri Lanka National Emblem">

  <img class="exhibition"
       src="national-science-week-2026.png"
       alt="National Science Week 2026">

</header>

<main>

<section id="welcome" class="panel welcome">

  <div class="kicker">National Science Week 2026</div>

  <h1>Welcome</h1>

  <p class="intro">
    Register your participation in National Science Week 2026.
    Please complete the three short questions.
  </p>

  <button id="startBtn" class="primary">
    CLICK HERE TO REGISTER →
  </button>

</section>

<section id="formPanel" class="panel hidden">

  <div class="form-head">
    <div class="kicker">National Science Week 2026</div>
    <h2>Participant Registration</h2>
    <p>Please answer all three questions and submit once.</p>
  </div>

  <div class="form-grid">

    <div class="question-block">

      <span class="q-icon">♙</span>

      <div class="question-label">1. Gender</div>

      <div id="genderChoices" class="choices">

        <button type="button"
                class="choice male"
                data-value="Male"
                aria-pressed="false">
          ♂ Male
        </button>

        <button type="button"
                class="choice female"
                data-value="Female"
                aria-pressed="false">
          ♀ Female
        </button>

      </div>
    </div>

    <div class="question-block">

      <span class="q-icon">▣</span>

      <div class="question-label">2. Professional</div>

      <div id="professionalChoices" class="choices">

        <button type="button"
                class="choice prof"
                data-value="Student"
                aria-pressed="false">
          Student
        </button>

        <button type="button"
                class="choice prof"
                data-value="Employee"
                aria-pressed="false">
          Employee
        </button>

        <button type="button"
                class="choice prof"
                data-value="Unemployed"
                aria-pressed="false">
          Unemployed
        </button>

      </div>
    </div>

    <div class="question-block">

      <span class="q-icon">⌖</span>

      <div class="question-label">3. District</div>

      <div class="district-area">

        <input id="districtSearch"
               class="search"
               type="search"
               placeholder="Search your district..."
               autocomplete="off">

        <div id="districtList" class="district-list"></div>

        <p id="selectedDistrict" class="selected"></p>

      </div>
    </div>

  </div>

  <div class="submit-row">

    <button id="nextBtn" class="primary" disabled>
      SUBMIT REGISTRATION
    </button>

  </div>

</section>

</main>

<footer class="footer">

  <img class="ministry"
       src="ministry-name-three-languages.png"
       alt="Ministry of Science and Technology">

</footer>

</div>

<!-- Hidden iframe transport to Google Apps Script -->

<iframe name="submissionFrame"
        id="submissionFrame"
        class="hidden"
        title="Registration submission"></iframe>

<form id="transportForm"
      class="hidden"
      method="post"
      target="submissionFrame">

  <input type="hidden" name="payload" id="payloadField">
  <input type="hidden" name="clientToken" id="clientTokenField">

</form>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyH-9I0OyJqyVGdrdOVGBVzhgyQ28M4bWzILAOzfr_5j9mZtmtk9ufzJ3t-WkGnqNZW/exec";

const districts = [
  "Ampara","Anuradhapura","Badulla","Batticaloa","Colombo",
  "Galle","Gampaha","Hambantota","Jaffna","Kalutara","Kandy",
  "Kegalle","Kilinochchi","Kurunegala","Mannar","Matale",
  "Matara","Monaragala","Mullaitivu","Nuwara Eliya",
  "Polonnaruwa","Puttalam","Ratnapura","Trincomalee","Vavuniya"
];

const state = {
  gender:"",
  professional:"",
  district:"",
  pendingToken:"",
  pendingSequenceKey:"",
  pendingSequenceNumber:0,
  timeout:null
};

const $ = id => document.getElementById(id);

let toastTimer;

function showToast(message,type="info") {
  clearTimeout(toastTimer);

  const box = $("toast");
  box.textContent = message;
  box.className = "toast " + type;

  toastTimer = setTimeout(() => {
    box.classList.add("hidden");
  },2500);
}

function updateSubmit() {
  $("nextBtn").disabled =
    !(state.gender && state.professional && state.district)
    || !!state.pendingToken;
}

function resetForm() {
  state.gender = "";
  state.professional = "";
  state.district = "";

  document.querySelectorAll(".choice").forEach(button => {
    button.setAttribute("aria-pressed","false");
  });

  $("districtSearch").value = "";
  $("selectedDistrict").textContent = "";
  $("districtList").classList.remove("open");

  renderDistricts("");
  $("nextBtn").textContent = "SUBMIT REGISTRATION";

  updateSubmit();
}

function showWelcome() {
  $("formPanel").classList.add("hidden");
  $("welcome").classList.remove("hidden");
  resetForm();
}

function choose(group,value,key) {
  state[key] = value;

  $(group).querySelectorAll(".choice").forEach(button => {
    button.setAttribute(
      "aria-pressed",
      String(button.dataset.value === value)
    );
  });

  updateSubmit();
}

document.querySelectorAll("#genderChoices .choice")
.forEach(button => {
  button.addEventListener("click",() => {
    choose("genderChoices",button.dataset.value,"gender");
  });
});

document.querySelectorAll("#professionalChoices .choice")
.forEach(button => {
  button.addEventListener("click",() => {
    choose("professionalChoices",button.dataset.value,"professional");
  });
});

function renderDistricts(query) {

  const list = $("districtList");
  list.replaceChildren();

  const matches = districts.filter(district =>
    district.toLowerCase().includes(query.trim().toLowerCase())
  );

  if (!matches.length) {
    const empty = document.createElement("div");
    empty.className = "noresult";
    empty.textContent = "No matching district found.";
    list.appendChild(empty);
    return;
  }

  matches.forEach(district => {

    const button = document.createElement("button");

    button.type = "button";
    button.className = "district";
    button.textContent = district;

    button.setAttribute(
      "aria-pressed",
      String(state.district === district)
    );

    button.addEventListener("click",() => {

      state.district = district;

      $("districtSearch").value = district;

      $("selectedDistrict").textContent =
        "Selected: " + district;

      $("districtList").classList.remove("open");

      renderDistricts(district);
      updateSubmit();

    });

    list.appendChild(button);

  });
}

$("districtSearch").addEventListener("focus",() => {

  $("districtList").classList.add("open");

  renderDistricts($("districtSearch").value);

});

$("districtSearch").addEventListener("input",event => {

  state.district = "";

  $("selectedDistrict").textContent = "";

  $("districtList").classList.add("open");

  renderDistricts(event.target.value);

  updateSubmit();

});

document.addEventListener("click",event => {

  if (!event.target.closest(".district-area")) {
    $("districtList").classList.remove("open");
  }

});

$("startBtn").addEventListener("click",() => {

  $("welcome").classList.add("hidden");
  $("formPanel").classList.remove("hidden");

  resetForm();

});

/* DEVICE-SPECIFIC REFERENCE NUMBER */

function getDeviceCode() {

  const key = "NSW2026_DEVICE_CODE";

  let code = localStorage.getItem(key);

  if (!code) {

    const raw = (
      crypto.randomUUID
        ? crypto.randomUUID()
        : String(Date.now()) + Math.random()
    );

    code = "D" + raw
      .replace(/[^a-zA-Z0-9]/g,"")
      .slice(0,6)
      .toUpperCase();

    localStorage.setItem(key,code);

  }

  return code;

}

function getNextDeviceSequence() {

  const key =
    "NSW2026_DEVICE_SEQUENCE_" + getDeviceCode();

  const current =
    parseInt(localStorage.getItem(key) || "0",10) || 0;

  return {
    key:key,
    number:current + 1
  };

}

function makeDeviceRequestId() {

  const next = getNextDeviceSequence();

  return {

    id:
      getDeviceCode() + "-" +
      String(next.number).padStart(6,"0"),

    sequenceKey:next.key,

    sequenceNumber:next.number

  };

}

/* REGISTRATION SUBMISSION */

function submitRegistration() {

  if (!(state.gender && state.professional && state.district)) {

    showToast(
      "Please answer all three questions.",
      "error"
    );

    return;

  }

  if (!API_URL.startsWith("https://script.google.com/macros/s/")) {

    showToast(
      "Registration system is not configured.",
      "error"
    );

    return;

  }

  if (state.pendingToken) return;

  const deviceRequest = makeDeviceRequestId();

  const token = deviceRequest.id;

  state.pendingToken = token;

  state.pendingSequenceKey = deviceRequest.sequenceKey;

  state.pendingSequenceNumber = deviceRequest.sequenceNumber;

  $("nextBtn").disabled = true;

  $("nextBtn").textContent = "SUBMITTING...";

  const payload = {

    gender:state.gender,

    professional:state.professional,

    district:state.district,

    requestId:token

  };

  $("payloadField").value = JSON.stringify(payload);

  $("clientTokenField").value = token;

  $("transportForm").action = API_URL;

  $("transportForm").submit();

  state.timeout = setTimeout(() => {

    if (state.pendingToken === token) {

      state.pendingToken = "";

      $("nextBtn").textContent = "SUBMIT REGISTRATION";

      updateSubmit();

      showToast(
        "No confirmation received. Please check the connection before retrying.",
        "error"
      );

    }

  },20000);

}

/* BACKEND CONFIRMATION */

window.addEventListener("message",event => {

  const data = event.data;

  if (
    !data ||
    data.type !== "MST_REGISTRATION_RESULT" ||
    data.clientToken !== state.pendingToken
  ) {
    return;
  }

  clearTimeout(state.timeout);

  if (data.success) {

    // Increase the device sequence only after successful saving.

    if (
      state.pendingSequenceKey &&
      state.pendingSequenceNumber
    ) {

      localStorage.setItem(
        state.pendingSequenceKey,
        String(state.pendingSequenceNumber)
      );

    }

    const confirmedRequestId = state.pendingToken;

    state.pendingToken = "";

    showToast(
      "Registration successful · " + confirmedRequestId,
      "success"
    );

    setTimeout(showWelcome,1800);

  } else {

    state.pendingToken = "";

    $("nextBtn").textContent = "SUBMIT REGISTRATION";

    updateSubmit();

    showToast(
      data.message || "Registration failed. Please try again.",
      "error"
    );

  }

});

renderDistricts("");

</script>

</body>
</html>
